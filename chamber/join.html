<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >

  <title>Togane Chamber of Commerce - Join Us</title>
  <meta name="description" content="Apply to become a member of the Togane Chamber of Commerce and connect with local businesses.">
  <meta name="author" content="Laura Paola Nunez Cala">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Normalize CSS -->
  <link rel="stylesheet" href="styles/normalize.css" >

  <!-- Estilo principal -->
  <link rel="stylesheet" href="styles/styles.css" >

  <!-- Facebook Meta Tags -->
  <meta property="og:title" content="Join Togane Chamber" >
  <meta property="og:description" content="Become a member of Togane Chamber of Commerce and grow your business with us.">
  <meta property="og:image" content="https://ichlaura.github.io/wdd231/chamber/images/favicon.svg">
  <meta property="og:url" content="https://ichlaura.github.io/wdd231/chamber/join.html" >
  <meta property="og:type" content="website">

 
 
</head>

<body>
  <div class="container">

    <header>
      <p>Supporting Local Business & Community Growth</p>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="discover.html">Discover</a></li>
        <li><a href="directory.html">Directory</a></li>
        <li><a href="join.html" class="active">Join</a></li>
      </ul>
    </nav>

    <main>
      <h1>Join the Chamber of Commerce</h1>

      <form method="get" action="thankyou.html" id="membershipForm" novalidate>
        <label for="firstName">First Name:
          <input type="text" id="firstName" name="firstName" required autocomplete="given-name" />
        </label>

        <label for="lastName">Last Name:
          <input type="text" id="lastName" name="lastName" required autocomplete="family-name" />
        </label>

        <label for="orgTitle">Organization Title:
          <input type="text" id="orgTitle" name="orgTitle" autocomplete="organization-title"
            pattern="[A-Za-z\s-]{7,}" 
            title="Only letters, spaces, and hyphens; minimum 7 characters" />
        </label>

        <label for="email">Email:
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="example@domain.com" />
        </label>

        <label for="phone">Mobile Phone:
          <input type="tel" id="phone" name="phone" required autocomplete="tel" />
        </label>

        <label for="orgName">Organization Name:
          <input type="text" id="orgName" name="orgName" required autocomplete="organization" />
        </label>

        <label for="membershipLevel">Membership Level:
          <select id="membershipLevel" name="membershipLevel" required>
            <option value="" disabled selected>Select membership level</option>
            <option value="np">NP Membership (Non-Profit, Free)</option>
            <option value="bronze">Bronze Membership</option>
            <option value="silver">Silver Membership</option>
            <option value="gold">Gold Membership</option>
          </select>
        </label>

        <label for="orgDesc">Organization Description:
          <textarea id="orgDesc" name="orgDesc" rows="4" placeholder="Tell us about your organization..."></textarea>
        </label>

        <input type="hidden" id="timestamp" name="timestamp" />

        <input type="submit" value="Submit Membership Application" />
      </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Togane Chamber of Commerce | Laura P. Núñez</p>
        <p>Last updated: <span id="lastModified"></span></p>
      </footer>
    
    

  </div>

  <script>
    // Añadir timestamp actual al enviar formulario
    const form = document.getElementById('membershipForm');
    form.addEventListener('submit', (event) => {
      const timestampInput = document.getElementById('timestamp');
      timestampInput.value = new Date().toISOString();
      // Puedes agregar validaciones personalizadas aquí si quieres
    });
  </script>
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
        document.getElementById("lastModified").textContent = document.lastModified;
      </script>
   
</body>
</html>
