<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Servicios de traducción profesional entre idiomas asiáticos y latinos." />
  <meta name="author" content="Laura Núñez" />
  <title>LangBridge - Traducciones</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>LangBridge</h1>
    <nav>
      <button id="menuBtn">☰</button>
      <ul id="navLinks">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="courses.html">Cursos</a></li>
        <li><a href="translations.html">Traducciones</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Solicita una traducción</h2>
    <form action="form-action.html" method="get">
      <label for="name">Nombre:</label>
      <input type="text" name="name" id="name" required />
      
      <label for="email">Correo:</label>
      <input type="email" name="email" id="email" required />

      <label for="langpair">Idioma de origen y destino:</label>
      <select name="langpair" id="langpair" required>
        <option value="es-en">Español a Inglés</option>
        <option value="en-ja">Inglés a Japonés</option>
        <option value="ko-es">Coreano a Español</option>
        <option value="zh-es">Chino a Español</option>
      </select>

      <label for="text">Texto a traducir:</label>
      <textarea name="text" id="text" rows="4" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 LangBridge</p>
    <a href="attributions.html">Atribuciones</a> |
    <a href="https://youtu.be/tu-video" target="_blank">Video de demostración</a>
  </footer>
</body>
</html>
